<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscrições – Instituto Alberto Magno</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap");
  :root { --azul:#024E80; --amarelo:#F9D159; --texto:#666666; --tinta:#2b3440; --linha:#e3e8ee; --fundo:#f4f7fa; --erro:#b00020; --ok:#2e7d32; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:15.5px/1.75 Poppins,Helvetica,Arial,sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  .topo { background:#fff; padding:14px 22px; box-shadow:0 1px 0 var(--linha); }
  .topo a { display:inline-block; line-height:0; }
  .topo img { height:46px; width:auto; }
  .hero { position:relative; background:var(--azul); }
  .hero .foto { display:block; width:100%; height:230px; object-fit:cover; object-position:center 30%; }
  .hero .foto.curso { height:auto; max-height:380px; }
  .cartao .capa { display:block; width:calc(100% + 56px); max-width:none; height:auto; margin:-26px -28px 20px; }
  .hero .faixa { background:var(--azul); color:#fff; padding:22px 22px 24px; border-left:10px solid var(--amarelo); }
  .hero .faixa div { max-width:880px; margin:0 auto; }
  .hero .faixa strong { display:block; font-weight:600; font-size:1.25rem; line-height:1.3; letter-spacing:.02em; text-transform:uppercase; }
  .hero .faixa span { display:block; margin-top:6px; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; opacity:.9; }
  main { flex:1; width:100%; max-width:880px; margin:0 auto; padding:44px 22px 72px; }
  h1 { font-size:1.9rem; line-height:1.25; font-weight:300; text-transform:uppercase; letter-spacing:.01em; margin:0 0 10px; color:var(--azul); }
  h2 { font-size:1.2rem; font-weight:500; line-height:1.35; margin:0 0 10px; color:var(--azul); }
  .sub { color:var(--texto); margin:0 0 30px; font-size:1.02rem; }
  .cartao { background:#fff; border-left:6px solid var(--amarelo); box-shadow:0 2px 14px rgba(2,78,128,.08); padding:26px 28px; margin:0 0 26px; }
  .cartao p { margin:6px 0; }
  .meta { color:var(--texto); font-size:.95rem; }
  .meta.dest { color:var(--azul); font-weight:500; }
  .desc { white-space:pre-line; margin:14px 0; }
  a.botao, button { display:inline-block; font:inherit; font-weight:500; letter-spacing:.04em; text-transform:uppercase; font-size:.88rem; color:#fff; background:var(--azul); border:2px solid var(--azul); border-radius:0; padding:12px 26px; cursor:pointer; text-decoration:none; transition:background .15s,color .15s; }
  a.botao:hover, button:hover:not(:disabled) { background:var(--amarelo); border-color:var(--amarelo); color:var(--azul); }
  button:disabled { opacity:.55; cursor:default; }
  a.voltar { display:inline-block; margin:0 0 22px; color:var(--azul); text-decoration:none; font-size:.92rem; font-weight:500; }
  a.voltar:hover { text-decoration:underline; }
  .etiqueta { display:inline-block; font-size:.8rem; font-weight:500; letter-spacing:.06em; text-transform:uppercase; padding:3px 12px; background:#fdecea; color:var(--erro); }
  .vagas { font-size:.88rem; color:var(--texto); margin-left:10px; }
  form label.p { display:block; font-weight:500; color:var(--tinta); margin:26px 0 8px; }
  form .ajuda { display:block; font-weight:300; color:var(--texto); font-size:.9rem; margin-top:2px; }
  form .obr { color:var(--erro); }
  input[type=text], input[type=email], input[type=tel], select, textarea { width:100%; font:inherit; padding:11px 13px; border:1px solid #b6c0cc; border-radius:0; background:#fff; color:var(--tinta); }
  input[type=text]:focus, input[type=email]:focus, input[type=tel]:focus, select:focus, textarea:focus { outline:2px solid var(--amarelo); border-color:var(--azul); }
  textarea { min-height:100px; }
  .op { display:flex; gap:11px; align-items:flex-start; font-weight:400; margin:9px 0; cursor:pointer; }
  .op input { margin-top:6px; flex:none; accent-color:var(--azul); }
  .aceitar { font-weight:300; font-size:.92rem; line-height:1.6; margin-top:20px; }
  #erro { color:var(--erro); font-weight:500; margin:22px 0 0; }
  .armadilha { position:absolute; left:-9999px; height:0; overflow:hidden; }
  .feito { text-align:center; padding:40px 24px; }
  .feito .tick { font-size:2.8rem; color:var(--ok); line-height:1; margin-bottom:10px; }
  .rodape { background:var(--amarelo); color:#222; padding:26px 22px; font-size:.9rem; line-height:1.7; }
  .rodape div { max-width:880px; margin:0 auto; }
  .rodape a { color:#222; }
  @media (max-width:560px) { .hero .foto { height:170px; } .hero .foto.curso { max-height:240px; } .cartao .capa { width:calc(100% + 36px); margin:-20px -18px 16px; } h1 { font-size:1.5rem; } .cartao { padding:20px 18px; } main { padding-top:32px; } }
</style>
</head>
<body>
<header class="topo"><a href="./"><img src="https://institutoalbertomagno.com/wp-content/uploads/2026/10/logo.png" alt="Instituto Alberto Magno"></a></header>
<div class="hero">
  <img class="foto" id="heroFoto" src="https://institutoalbertomagno.com/wp-content/uploads/2026/11/1-1.png" alt="" onerror="this.style.display='none'">
  <div class="faixa"><div><strong>Instituto<br>Alberto Magno</strong><span>Formação de professores</span></div></div>
</div>
<main id="app"><p class="sub">A carregar…</p></main>
<footer class="rodape"><div>Instituto Alberto Magno · R. da Lapa 100, 1200-796 Lisboa<br><a href="https://www.institutoalbertomagno.com">www.institutoalbertomagno.com</a></div></footer>

<script>
// Endereço da aplicação web do Apps Script (Implementar > Aplicação Web). Colar aqui, entre aspas.
const API_URL = "https://script.google.com/macros/s/AKfycbz3GnSccsoIZh4ypgcwGi2Xnc_xRcDxv9rkKNNkugHY2xxNO9M4RFPN2ixLalH3eM0U/exec";

const app = document.getElementById("app");
const el = (tag, attrs, ...filhos) => {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (v === undefined) return; if (k === "class") e.className = v; else if (k in e && k !== "list") e[k] = v; else e.setAttribute(k, v); });
  filhos.flat().forEach((f) => { if (f != null && f !== false) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
  return e;
};
const urlImagem = (v) => !v ? "" : /^https:\/\//i.test(v) ? v : "imagens/" + encodeURIComponent(v);
const limpar = () => { app.innerHTML = ""; window.scrollTo(0, 0); };
const aviso = (msg, contacto) => {
  limpar();
  app.appendChild(el("p", { class: "sub" }, msg));
  if (contacto) app.appendChild(el("p", { class: "meta" }, "Contacto: " + contacto));
};

async function pedir(params) {
  const r = await fetch(API_URL + "?" + new URLSearchParams(params).toString());
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

/* ---------- lista de cursos ---------- */
async function mostrarLista() {
  let d;
  try { d = await pedir({}); } catch (e) { return aviso("Não foi possível carregar os cursos. Tente outra vez daqui a pouco."); }
  document.title = d.titulo || document.title;
  if (d.fechado) return aviso("As inscrições estão fechadas de momento.", d.contacto);
  if (d.erro) return aviso(d.erro);
  limpar();
  app.appendChild(el("h1", {}, d.titulo || "Inscrições"));
  if (!d.cursos.length) { app.appendChild(el("p", { class: "sub" }, "Não há cursos abertos a inscrições neste momento.")); return; }
  app.appendChild(el("p", { class: "sub" }, "Escolha o curso em que se quer inscrever."));
  d.cursos.forEach((c) => {
    app.appendChild(el("div", { class: "cartao" },
      c.imagem && el("img", { class: "capa", src: urlImagem(c.imagem), alt: "", onerror: function () { this.style.display = "none"; } }),
      el("h2", {}, c.titulo),
      c.datas && el("p", { class: "meta" }, c.datas),
      c.local && el("p", { class: "meta" }, c.local),
      c.descricao && el("p", { class: "desc" }, c.descricao),
      c.preco && el("p", { class: "meta dest" }, "Preço: " + c.preco),
      c.esgotado ? el("span", { class: "etiqueta" }, "Sem vagas")
        : el("p", {}, el("a", { class: "botao", href: "?curso=" + encodeURIComponent(c.codigo) }, "Inscrever-me"),
            c.vagasRestantes != null && el("span", { class: "vagas" }, "Vagas: " + c.vagasRestantes))));
  });
}

/* ---------- formulário de um curso ---------- */
async function mostrarCurso(codigo) {
  let d;
  try { d = await pedir({ curso: codigo }); } catch (e) { return aviso("Não foi possível carregar o curso. Tente outra vez daqui a pouco."); }
  if (d.fechado) return aviso("As inscrições estão fechadas de momento.", d.contacto);
  if (d.erro) { aviso(d.erro, d.contacto); app.appendChild(el("p", {}, el("a", { class: "voltar", href: "./" }, "← Ver os cursos abertos"))); return; }
  const c = d.curso;
  document.title = c.titulo + " – " + (d.titulo || "Inscrições");
  limpar();
  if (c.imagem) { const h = document.getElementById("heroFoto"); if (h) { h.src = urlImagem(c.imagem); h.className = "foto curso"; h.style.display = ""; } }
  app.appendChild(el("h1", {}, c.titulo));
  app.appendChild(el("p", { class: "sub" }, [c.datas, c.local].filter(Boolean).join(" · ")));
  if (c.descricao) app.appendChild(el("p", { class: "desc" }, c.descricao));
  if (c.preco) app.appendChild(el("p", { class: "meta dest" }, "Preço: " + c.preco));
  if (c.esgotado) { app.appendChild(el("p", {}, el("span", { class: "etiqueta" }, "Sem vagas"))); return; }

  const form = el("form", { novalidate: true });
  const campos = [];
  d.perguntas.forEach((q, i) => {
    const id = "q" + i;
    const rotulo = (txt) => el("label", { class: "p", htmlFor: id }, txt, q.obrig && el("span", { class: "obr" }, " *"), q.ajuda && el("span", { class: "ajuda" }, q.ajuda));
    let leitura;
    if (q.tipo === "aceitar") {
      const cx = el("input", { type: "checkbox", id });
      form.appendChild(el("label", { class: "op aceitar", htmlFor: id }, cx, el("span", {}, q.texto + (q.obrig ? " *" : ""), " ", el("em", {}, "(" + (q.opcoes[0] || "Tomei conhecimento") + ")"))));
      leitura = () => cx.checked;
    } else if (q.tipo === "escolha") {
      form.appendChild(el("div", { class: "p" }, rotulo(q.texto)));
      const radios = q.opcoes.map((o) => { const r = el("input", { type: "radio", name: id, value: o }); form.appendChild(el("label", { class: "op" }, r, o)); return r; });
      leitura = () => { const m = radios.find((r) => r.checked); return m ? m.value : ""; };
    } else if (q.tipo === "lista") {
      form.appendChild(el("div", { class: "p" }, rotulo(q.texto)));
      const cxs = q.opcoes.map((o) => { const x = el("input", { type: "checkbox", value: o }); form.appendChild(el("label", { class: "op" }, x, o)); return x; });
      leitura = () => cxs.filter((x) => x.checked).map((x) => x.value);
    } else {
      form.appendChild(rotulo(q.texto));
      const tipoInput = q.tipo === "email" ? "email" : q.tipo === "telefone" ? "tel" : "text";
      const campo = q.tipo === "texto longo" ? el("textarea", { id }) : el("input", { type: tipoInput, id, autocomplete: q.tipo === "email" ? "email" : q.tipo === "telefone" ? "tel" : q.tipo === "nome" ? "name" : "off", inputMode: q.tipo === "nif" ? "numeric" : undefined });
      form.appendChild(campo);
      leitura = () => campo.value;
    }
    campos.push({ q, leitura });
  });
  form.appendChild(el("div", { class: "armadilha", "aria-hidden": "true" }, el("input", { type: "text", name: "website", id: "website", tabIndex: -1, autocomplete: "off" })));
  const erro = el("div", { id: "erro", role: "alert" });
  const botao = el("button", { type: "submit" }, "Enviar inscrição");
  form.appendChild(erro);
  form.appendChild(el("p", {}, botao));
  app.appendChild(el("div", { class: "cartao" }, form));

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    erro.textContent = "";
    const respostas = {};
    for (const { q, leitura } of campos) {
      const v = leitura();
      const vazio = Array.isArray(v) ? !v.length : (v === false || String(v).trim() === "");
      if (q.obrig && vazio) { erro.textContent = "Falta preencher: " + (q.texto.length > 70 ? q.texto.slice(0, 67) + "…" : q.texto); return; }
      respostas[q.texto] = v;
    }
    botao.disabled = true; botao.textContent = "A enviar…";
    try {
      const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ curso: c.codigo, respostas, website: document.getElementById("website").value }) });
      const j = await r.json();
      if (j.erro) { erro.textContent = j.erro; botao.disabled = false; botao.textContent = "Enviar inscrição"; return; }
      mostrarSucesso(c, j, respostas, d.perguntas);
    } catch (e) {
      erro.textContent = "Não foi possível enviar. Verifique a ligação e tente outra vez.";
      botao.disabled = false; botao.textContent = "Enviar inscrição";
    }
  });
}

function mostrarSucesso(c, j, respostas, perguntas) {
  const qEmail = perguntas.find((q) => q.tipo === "email");
  const email = qEmail ? respostas[qEmail.texto] : "";
  limpar();
  const msg = j.email === "enviado" || j.email === "ja-enviado"
    ? ["Enviámos um email de confirmação" + (email ? " para " + email : "") + ".", "O pagamento é tratado num segundo passo, por email."]
    : ["A sua inscrição ficou registada, mas não foi possível enviar o email de confirmação.", j.contacto ? "Se não tiver notícias nossas, contacte-nos: " + j.contacto : ""];
  app.appendChild(el("div", { class: "cartao feito" },
    el("div", { class: "tick" }, "✔"),
    el("h1", {}, "Inscrição recebida"),
    el("p", {}, c.titulo),
    ...msg.filter(Boolean).map((t) => el("p", {}, t)),
    el("p", {}, el("a", { class: "voltar", href: "./" }, "← Voltar aos cursos"))));
}

/* ---------- arranque ---------- */
if (API_URL.indexOf("COLAR_AQUI") === 0) aviso("Falta ligar o site: colocar o endereço da aplicação web em API_URL.");
else {
  const codigo = new URLSearchParams(location.search).get("curso");
  if (codigo) mostrarCurso(codigo); else mostrarLista();
}
</script>
</body>
</html>
